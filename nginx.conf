server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  location = __APP_BASE_PATH__ {
    return 301 __APP_BASE_PATH__/;
  }

  location = __APP_BASE_PATH__/index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location __APP_BASE_PATH__/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location __APP_BASE_PATH__/ {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri $uri/ __APP_BASE_PATH__/index.html;
  }
}
